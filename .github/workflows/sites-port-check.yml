name: Sites port syntax check
on:
  push:
    branches: [chatgpt-sites-port]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Sites entrypoint syntax
        run: |
          npm run check:sites
          npm run test:sites
