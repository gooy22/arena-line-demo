name: Vercel production smoke test

on:
  push:
    branches: [vercel-deploy]
    paths:
      - ".github/workflows/vercel-smoke.yml"
      - "server.mjs"
      - "profile_store.mjs"
      - "package.json"
      - "dist/**"
      - "overrides/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public production routes
        env:
          BASE_URL: https://arena-line-demo-vercel.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
              ...options,
            });
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { response, text, json };
          }

          let health;
          let lastError;
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              health = await request('/health');
              if (health.response.status === 200 && health.json?.ok === true) break;
              lastError = new Error('/health returned ' + health.response.status + ': ' + health.text.slice(0, 300));
            } catch (error) {
              lastError = error;
            }
            await sleep(5000);
          }

          if (!health || health.response.status !== 200 || health.json?.ok !== true) {
            throw new Error('Production health check failed: ' + (lastError?.message || 'no valid response'));
          }

          const storage = health.json.profileStorage || {};
          const syncStorage = health.json.syncStorage || {};
          if (storage.backend !== 'vercel-blob' || storage.persistent !== true) {
            throw new Error('Durable profile storage is not active: ' + JSON.stringify(storage));
          }
          if (syncStorage.backend !== 'vercel-blob' || syncStorage.persistent !== true) {
            throw new Error('Durable cross-instance sync storage is not active: ' + JSON.stringify(syncStorage));
          }

          const checks = [
            { path: '/', status: 200, type: 'text/html', includes: 'Arena Line' },
            { path: '/v112/app.js', status: 200, type: 'javascript' },
            { path: '/v112/theme.css', status: 200, type: 'text/css' },
            { path: '/manifest.webmanifest', status: 200, type: 'manifest' },
            { path: '/api/sync/status', status: 200, type: 'json' },
          ];

          for (const check of checks) {
            const { response, text, json } = await request(check.path);
            const type = (response.headers.get('content-type') || '').toLowerCase();
            if (response.status !== check.status) {
              throw new Error(check.path + ' expected ' + check.status + ', got ' + response.status + ': ' + text.slice(0, 200));
            }
            if (check.type === 'javascript' && !type.includes('javascript')) throw new Error(check.path + ' wrong content-type: ' + type);
            if (check.type === 'text/css' && !type.includes('text/css')) throw new Error(check.path + ' wrong content-type: ' + type);
            if (check.type === 'html' && !type.includes('text/html')) throw new Error(check.path + ' wrong content-type: ' + type);
            if (check.type === 'manifest' && !type.includes('json')) throw new Error(check.path + ' wrong content-type: ' + type);
            if (check.type === 'json' && (!type.includes('json') || json?.ok !== true)) throw new Error(check.path + ' did not return valid API JSON: ' + text.slice(0, 200));
            if (check.includes && !text.includes(check.includes)) throw new Error(check.path + ' missing expected page text');
            console.log('PASS', check.path, response.status, type, text.length + ' bytes');
          }

          const auth = await request('/api/profile?email=smoke%40example.invalid');
          if (auth.response.status !== 401 || auth.json?.error !== 'Unauthorized') {
            throw new Error('Profile endpoint did not enforce auth as expected: ' + auth.response.status + ' ' + auth.text.slice(0, 200));
          }
          console.log('PASS profile auth guard', auth.response.status);
          console.log('PASS /health', JSON.stringify({
            source: health.json.source,
            runtime: health.json.runtime,
            profileStorage: storage,
            syncStorage,
            resultsSource: health.json.resultsSource
          }));
          NODE

  browser-smoke:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium and Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Open the live site and check browser runtime
        env:
          BASE_URL: https://arena-line-demo-vercel.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const pageErrors = [];
          const consoleErrors = [];
          const failedRequests = [];

          page.on('pageerror', error => pageErrors.push(String(error?.stack || error?.message || error)));
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push(message.text().slice(0,300));
          });
          page.on('requestfailed', request => {
            failedRequests.push({url:request.url(),error:request.failure()?.errorText || 'request failed'});
          });

          try {
            const response = await page.goto(process.env.BASE_URL, {waitUntil:'domcontentloaded',timeout:45000});
            if (!response || response.status() !== 200) {
              throw new Error('Main document did not return HTTP 200: ' + (response?.status() ?? 'no response'));
            }
            await page.waitForTimeout(8000);

            const title = await page.title();
            const bodyText = await page.locator('body').innerText().catch(() => '');
            const resources = await page.evaluate(() => performance.getEntriesByType('resource').map(item => item.name));
            const appScriptLoaded = resources.some(url => url.includes('/v112/app.js'));
            const cssLoaded = resources.some(url => url.includes('/v112/theme.css'));

            if (title !== 'Arena Line') throw new Error('Unexpected page title: ' + JSON.stringify(title));
            if (bodyText.trim().length < 80) throw new Error('The rendered page is blank or unexpectedly short: ' + bodyText.length + ' chars');
            if (!appScriptLoaded) throw new Error('Main application JavaScript did not load');
            if (!cssLoaded) throw new Error('Main application stylesheet did not load');
            if (pageErrors.length) throw new Error('Browser JavaScript exceptions: ' + JSON.stringify(pageErrors.slice(0,5)));

            console.log('PASS browser document', JSON.stringify({status:response.status(),title,bodyChars:bodyText.length,viewport:'390x844'}));
            console.log('PASS app assets', JSON.stringify({appScriptLoaded,cssLoaded,resourceCount:resources.length}));
            console.log('Browser console errors (diagnostic only):', JSON.stringify(consoleErrors.slice(0,10)));
            console.log('Failed requests (diagnostic only):', JSON.stringify(failedRequests.slice(0,10)));
          } finally {
            await browser.close();
          }
          NODE
