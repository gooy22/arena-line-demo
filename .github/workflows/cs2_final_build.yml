name: CS2 final dataset build

on:
  push:
    branches: [cs2-dataset-builder]
    paths:
      - ".github/workflows/cs2_final_build.yml"
      - "cs2builder/final_pipeline.py"
      - "cs2builder/feature_engineering.py"
      - "cs2builder/requirements-final.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-final-dataset-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cs2-dataset-builder
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cs2builder/requirements-final.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cs2builder/requirements-final.txt

      - name: Build dataset and train models
        run: |
          python -u cs2builder/final_pipeline.py --out cs2builder/artifacts

      - name: Show final summary
        if: always()
        run: |
          test -f cs2builder/artifacts/build_summary.json && cat cs2builder/artifacts/build_summary.json || true
          test -f cs2builder/artifacts/BUILD_REPORT.md && cat cs2builder/artifacts/BUILD_REPORT.md || true

      - name: Commit generated artifacts
        if: success()
        run: |
          git config user.name "cs2-dataset-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f cs2builder/artifacts/
          git diff --cached --quiet || git commit -m "cs2 final: publish leakage-safe dataset and model"
          git pull --rebase origin cs2-dataset-builder
          git push origin HEAD:cs2-dataset-builder

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-final-build
          path: |
            cs2builder/artifacts/
          if-no-files-found: warn
          retention-days: 14
