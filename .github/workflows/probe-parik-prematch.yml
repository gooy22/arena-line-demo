name: Probe Parik24 prematch esports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-parik-prematch.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Save esports page
        shell: bash
        run: |
          mkdir -p /tmp/parik-prematch
          curl -L -sS --compressed --connect-timeout 10 --max-time 25 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
            'https://parik24.me/uk/esports' -o /tmp/parik-prematch/esports.html
          wc -c /tmp/parik-prematch/esports.html
      - name: Upload esports page
        uses: actions/upload-artifact@v4
        with:
          name: parik-esports-page
          path: /tmp/parik-prematch/esports.html
          retention-days: 1
      - name: Probe prematch pages
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,re,html as H
          urls=[
            'https://parik24.me/uk/football',
            'https://parik24.me/uk/go',
            'https://parik24.me/uk/esports',
            'https://parik24.me/uk/cybersport',
          ]
          def curl(url):
            p=subprocess.run(['curl','-L','-sS','--compressed','--connect-timeout','10','--max-time','25',
              '-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',url],
              capture_output=True)
            return p.stdout.decode('utf-8','ignore')
          def text(x):
            x=re.sub(r'<[^>]+>',' ',x)
            return ' '.join(H.unescape(x).split())
          for url in urls:
            src=curl(url)
            print('\nURL',url,'bytes',len(src))
            if not src: continue
            title=re.search(r'<title[^>]*>(.*?)</title>',src,re.I|re.S)
            print('TITLE',text(title.group(1)) if title else '')
            print('EVENT_ANCHORS',len(re.findall(r'data-anchor=["\']event_\d+',src,re.I)))
            for needle in ['Кіберспорт','Counter-Strike','Dota','League of Legends','Valorant','ESportsBattle','Найближчі події']:
              print('COUNT',needle,src.lower().count(needle.lower()))
            for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',src,re.I):
              t=text(m.group(2))
              if re.search(r'кіберспорт|counter|dota|league of legends|valorant',t,re.I):
                print('LINK',repr(t[:180]),'->',m.group(1))
            # print nearby esports snippets
            low=src.lower()
            for needle in ['counter-strike','dota','league of legends','valorant','кіберспорт']:
              pos=0
              shown=0
              while shown<8:
                i=low.find(needle,pos)
                if i<0: break
                print('SNIP',needle,text(src[max(0,i-600):min(len(src),i+1600)])[:1400])
                pos=i+len(needle); shown+=1
          PY
