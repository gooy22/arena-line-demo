name: Unpack Arena Line Demo v32

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-v32.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact v32 source tree from embedded archive
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/workflows/publish-onefile.yml
          awk 'BEGIN{flag=0} /cat > \/tmp\/site\.b64 <<\x27EOF\x27/{flag=1; next} /^EOF$/{if(flag){exit}} flag{print}' .github/workflows/publish-onefile.yml > /tmp/site.b64
          test -s /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.tar.xz
          xz -t /tmp/site.tar.xz
          rm -rf /tmp/site
          mkdir -p /tmp/site
          tar -xJf /tmp/site.tar.xz -C /tmp/site
          DIST_INDEX="$(find /tmp/site -type f -path '*/dist/index.html' -print -quit)"
          test -n "$DIST_INDEX"
          ROOT="$(dirname "$(dirname "$DIST_INDEX")")"
          echo "Source root: $ROOT"

          rm -rf dist scripts tests worker server.mjs
          cp -a "$ROOT/dist" ./dist
          [ ! -d "$ROOT/scripts" ] || cp -a "$ROOT/scripts" ./scripts
          [ ! -d "$ROOT/tests" ] || cp -a "$ROOT/tests" ./tests
          [ ! -d "$ROOT/worker" ] || cp -a "$ROOT/worker" ./worker
          for f in README.md DESIGN.md package.json .gitignore; do
            [ ! -f "$ROOT/$f" ] || cp -a "$ROOT/$f" "./$f"
          done

          test -f dist/index.html
          test -f dist/assets/wordmark.png
          test -f dist/assets/icons/favorite.png
          test -f dist/account.mjs
          test -f dist/server/index.js
          grep -q "hoolop22@gmail.com" dist/account.mjs
          grep -q "wordmark.png" dist/index.html

          cat > server.mjs <<'EOF'
          import http from 'node:http';
          import { Readable } from 'node:stream';
          import app from './dist/server/index.js';

          const port = Number(process.env.PORT || 3000);
          const env = {};
          const ctx = { waitUntil(promise) { Promise.resolve(promise).catch(() => {}); } };

          async function readBody(req, limit = 2_000_000) {
            const chunks = [];
            let size = 0;
            for await (const chunk of req) {
              size += chunk.length;
              if (size > limit) throw new Error('Request body too large');
              chunks.push(chunk);
            }
            return Buffer.concat(chunks);
          }

          http.createServer(async (req, res) => {
            try {
              if (req.url === '/health') {
                res.statusCode = 200;
                res.setHeader('content-type', 'application/json; charset=utf-8');
                return res.end(JSON.stringify({ ok:true, app:'Arena Line Demo', source:'exact-v32-unpacked' }));
              }

              const method = req.method || 'GET';
              const body = ['GET','HEAD'].includes(method) ? undefined : await readBody(req);
              const request = new Request('http://localhost' + (req.url || '/'), {
                method,
                headers:req.headers,
                ...(body ? { body } : {})
              });

              const response = await app.fetch(request, env, ctx);
              res.statusCode = response.status;
              response.headers.forEach((value, key) => res.setHeader(key, value));
              res.setHeader('cache-control', 'no-store');
              if (method === 'HEAD' || response.status === 204 || !response.body) return res.end();
              Readable.fromWeb(response.body).pipe(res);
            } catch (error) {
              console.error('Arena Line exact v32 server error', error?.stack || error);
              res.statusCode = 500;
              res.setHeader('content-type', 'text/plain; charset=utf-8');
              res.end('Arena Line server error');
            }
          }).listen(port, '0.0.0.0', () => console.log(`Arena Line exact v32 listening on ${port}`));
          EOF

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.type='module'; p.scripts={...(p.scripts||{}), start:'node server.mjs'}; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          node --check server.mjs
          node --check dist/server/index.js

      - name: Commit exact v32 source tree
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist scripts tests worker README.md DESIGN.md package.json .gitignore server.mjs .github/workflows/unpack-v32.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Restore exact Arena Line Demo v32 source tree'
            git push origin HEAD:main
          fi
