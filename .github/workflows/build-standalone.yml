name: Build standalone Arena Line

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-standalone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build index
        shell: bash
        run: |
          set -euxo pipefail
          cat .onefile/chunk-*.b64 | base64 -d | xz -d > index.html
          echo '1596dec69509cb44181ee6c7155933b7b08f6c90ca75e70fe4a73e3a3c46297d  index.html' | sha256sum -c -
      - name: Commit index
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish standalone Arena Line v32'
            git push origin HEAD:main
          fi
