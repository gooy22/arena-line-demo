name: CS2 HLTV probe
on:
  push:
    branches: [cs2-dataset-builder]
    paths:
      - ".github/workflows/cs2_hltv_probe.yml"
      - "cs2builder/gha_probe.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cs2-dataset-builder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install beautifulsoup4 "curl-cffi>=0.16.1" "scrapling[fetchers]>=0.4.9"
      - run: patchright install --with-deps chromium
      - run: python cs2builder/gha_probe.py
      - name: Commit probe result
        run: |
          git config user.name "cs2-dataset-builder"
          git config user.email "actions@users.noreply.github.com"
          git add cs2builder/results/gha_probe_result.json
          git diff --cached --quiet || git commit -m "cs2 builder: record GitHub runner HLTV probe"
          git push
