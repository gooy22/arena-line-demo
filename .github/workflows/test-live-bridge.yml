name: Test Arena live bridge

on:
  push:
    branches: [main]
    paths:
      - server.mjs
      - feed.mjs
      - .github/workflows/test-live-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check feed.mjs
      - name: Start server
        run: |
          PORT=3100 node server.mjs > /tmp/arena-server.log 2>&1 &
          echo $! > /tmp/arena.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS 'http://127.0.0.1:3100/api/live?sport=CS&stage=live' >/tmp/live.json
          node -e "const x=require('/tmp/live.json'); console.log(JSON.stringify({ok:x.ok,source:x.source,total:x.total,sport:x.sport,events:x.events?.length,first:x.events?.[0]?.name,odds:x.events?.[0]?.selections?.map(s=>s.odds)})); if(!x.ok) process.exit(2)"
          cat /tmp/arena-server.log
          kill $(cat /tmp/arena.pid) || true
