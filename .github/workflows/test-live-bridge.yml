name: Test Arena live bridge

on:
  push:
    branches: [main]
    paths:
      - server.mjs
      - feed.mjs
      - .github/workflows/test-live-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check feed.mjs
      - name: Start server
        run: |
          PORT=3100 node server.mjs > /tmp/arena-server.log 2>&1 &
          echo $! > /tmp/arena.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS 'http://127.0.0.1:3100/api/live?sport=CS&stage=live' >/tmp/live.json
          curl -fsS 'http://127.0.0.1:3100/api/live?sport=CS&stage=prematch' >/tmp/prematch.json
          node - <<'NODE'
          const live=require('/tmp/live.json');
          const pre=require('/tmp/prematch.json');
          console.log('LIVE',JSON.stringify({ok:live.ok,source:live.source,total:live.total,events:live.events?.length,first:live.events?.[0]?.name,odds:live.events?.[0]?.selections?.map(s=>s.odds)}));
          console.log('PREMATCH',JSON.stringify({ok:pre.ok,source:pre.source,total:pre.total,events:pre.events?.length,first:pre.events?.[0]?.name,odds:pre.events?.[0]?.selections?.map(s=>s.odds)}));
          if(!live.ok || !pre.ok || !(live.events?.length) || !(pre.events?.length)) process.exit(2);
          NODE
          cat /tmp/arena-server.log
          kill $(cat /tmp/arena.pid) || true
