name: Discover current Parik24 feed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-parik-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Save current Parik24 page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/parik-probe
          curl -L -sS --compressed --connect-timeout 10 --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' \
            'https://parik24.me/uk/all-live/' -o /tmp/parik-probe/live.html
          for u in \
            'https://parik24.me/assets/js/app.js?v=1786961965' \
            'https://parik24.me/assets/js/main.js'; do
            n=$(basename "${u%%\?*}")
            curl -L -sS --compressed --connect-timeout 10 --max-time 30 \
              -A 'Mozilla/5.0 Chrome/153 Safari/537.36' "$u" -o "/tmp/parik-probe/$n"
          done
          wc -c /tmp/parik-probe/*
      - uses: actions/upload-artifact@v4
        with:
          name: parik-public-client
          path: /tmp/parik-probe
          retention-days: 1
      - name: Inspect current public Parik24 bundles
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import re, subprocess
          from urllib.parse import urljoin

          pages = [
              'https://www.parik24.org/uk/all-live/',
              'https://parik24.org/uk/all-live/',
              'https://parik24.me/uk/all-live/',
              'https://parikbet24.net/',
              'https://parik24.new/',
          ]

          def curl(url):
              try:
                  p = subprocess.run([
                      'curl','-L','-sS','--compressed',
                      '--connect-timeout','10','--max-time','25',
                      '-A','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
                      url
                  ], capture_output=True, timeout=35)
                  return p.stdout.decode('utf-8','ignore')
              except Exception:
                  return ''

          def mask(text):
              text = re.sub(r'(X-Api-Key[=:\'"\\s]+)[A-Za-z0-9._-]{8,}', r'\1<masked>', text, flags=re.I)
              text = re.sub(r'(X-Api-Key=)[^&\'"\\s]+', r'\1<masked>', text, flags=re.I)
              return text

          markers = [
              'direct-feed/feed','getlivericheventsbysport','getmarketsbyeventids',
              'x-api-key','websocket','eventsource','graphql','/api/',
              'signalr','hubconnection','socket.io','sports','events'
          ]

          for page in pages:
              html = curl(page)
              print('\nPAGE', page, 'bytes='+str(len(html)))
              if not html:
                  continue

              lower_html = html.lower()
              for marker in ['__next_data__','__nuxt__','graphql','/api/','websocket','eventsource','socket.io','direct-feed','signalr']:
                  i = lower_html.find(marker)
                  if i >= 0:
                      print('HTML_MARKER', marker)
                      print(mask(html[max(0,i-600):min(len(html),i+2200)]))

              scripts = []
              for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I):
                  u = urljoin(page, m.group(1))
                  if u not in scripts:
                      scripts.append(u)

              print('SCRIPTS', len(scripts))
              for u in scripts:
                  print('SCRIPT_URL', u)

              for script in scripts[:120]:
                  js = curl(script)
                  if not js:
                      continue
                  normalized = js.replace('\\/','/')
                  low = normalized.lower()
                  hits = [x for x in markers if x in low]

                  urls = re.findall(r'(?:https?|wss?)://[^"\'\\s)<>]+', normalized, re.I)
                  interesting_urls = [u for u in urls if re.search(r'parik|sport|feed|api|socket|hub|event|line|bet', u, re.I)]

                  paths = re.findall(r'["\']([^"\']{1,240})["\']', normalized)
                  interesting_paths = []
                  for p in paths:
                      if re.search(r'/(?:api|graphql|sport|event|feed|socket|hub|line|live)[/?A-Za-z0-9_.=&%:-]*', p, re.I):
                          if p not in interesting_paths:
                              interesting_paths.append(p)

                  if not hits and not interesting_urls and not interesting_paths:
                      continue

                  print('\nMATCHING_BUNDLE', script, 'bytes='+str(len(js)))
                  print('HITS', ','.join(hits))
                  for u in interesting_urls[:80]:
                      print('URL', mask(u))
                  for p in interesting_paths[:100]:
                      print('PATH', mask(p))

                  for needle in ['direct-feed/feed','websocket','graphql','socket.io','signalr','hubconnection','/api/']:
                      i = low.find(needle)
                      if i >= 0:
                          print('AROUND', needle)
                          print(mask(normalized[max(0,i-500):min(len(normalized),i+1800)]))
          PY
