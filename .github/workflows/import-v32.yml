name: Import Arena Line Demo v32 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v32.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact v32 static assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://arena-line-demo.sanekganggsta.chatgpt.site'
          fetch() {
            local path="$1" sha="$2" rel="${1#dist/}"
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 "$BASE/$rel" -o "$path"
            echo "$sha  $path" | sha256sum -c -
