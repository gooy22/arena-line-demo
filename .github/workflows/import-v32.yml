name: Diagnose Arena Line Demo v32 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v32.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe source and save result
        shell: bash
        run: |
          set +e
          URL='https://arena-line-demo.sanekganggsta.chatgpt.site/account.mjs'
          code=$(curl -sS -L --max-time 20 -o /tmp/account.mjs -w '%{http_code}' "$URL")
          curl_ec=$?
          bytes=$(wc -c </tmp/account.mjs 2>/dev/null || echo 0)
          sha=$(sha256sum /tmp/account.mjs 2>/dev/null | awk '{print $1}')
          {
            echo "http_code=$code"
            echo "curl_exit=$curl_ec"
            echo "bytes=$bytes"
            echo "sha256=$sha"
            echo "expected=d55ca57084ea7b8119f6fc59db3efdb1e992e13bcedf43b135f590a19d7540e9"
            echo '--- first 200 bytes ---'
            head -c 200 /tmp/account.mjs 2>/dev/null | tr '\n' ' '
            echo
          } > .github/import-diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/import-diagnostic.txt
          git commit -m 'Record v32 import diagnostic' || exit 0
          git push
