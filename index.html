<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171716">
  <title>Arena Line</title>
  <script>try{const t=localStorage.getItem('arena-theme-v1');const dark=t==='dark'||t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light'}catch{}</script>
  <script defer src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>

:root{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink,#292621);background:var(--page,#f5f4f1);--green:#009e69;--yellow:#f2f740;--black:#171716;--muted:#7b756b;--line:#e6e3de;--nav:54px;--header:56px;font-synthesis:weight;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
button,input,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid #007e54;outline-offset:2px}
svg{width:24px;height:24px;stroke-width:1.8;pointer-events:none;flex-shrink:0}
.ui-icon{display:block}
.wordmark{display:block;width:120px;height:auto;object-fit:contain}
.reference-graphic{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:darken;pointer-events:none}
.spinner{display:block;width:24px;height:24px;margin:auto;border:2px solid var(--line,#e6e3de);border-top-color:#969186;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.brand{display:flex;align-items:center;justify-content:flex-start;padding:0;flex-shrink:0}
.header-spacer{flex:1}
.header-icon{display:grid;place-items:center;width:32px;height:40px;padding:4px;color:var(--subtle,#969186);flex:none}
.deposit-button{height:32px;padding:0 14px;border-radius:100px;background:var(--green);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.deposit-button:hover{background:#008f5f}
.profile-layer{position:fixed;inset:0;z-index:20;overflow:hidden;background:var(--page,#f5f4f1)}
.profile-layer[hidden]{display:none}
.profile-header{position:absolute;top:0;left:0;right:0;z-index:2;padding-top:env(safe-area-inset-top);background:var(--black);color:#fff}
.header-inner{height:var(--header);max-width:640px;margin:auto;display:flex;align-items:center;gap:8px;padding:0 12px}
.back{margin-left:-4px;color:var(--subtle,#969186)}
.page-title{flex:1;text-align:center;font-size:16px;line-height:1.25;font-weight:600}
.profile-content{position:absolute;top:calc(var(--header) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));left:0;right:0;overflow:auto;overscroll-behavior:contain;max-width:640px;margin:auto;padding:12px 8px;background:var(--page,#f5f4f1);scrollbar-width:thin}
.profile-nav{position:absolute;bottom:0;left:0;right:0;z-index:2;padding-bottom:env(safe-area-inset-bottom);background:var(--black);color:var(--subtle,#969186)}
.nav-inner{height:var(--nav);max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:4px 1px;font-size:10px;line-height:14px;text-align:center}
.nav-item svg{width:24px;height:24px}
.nav-item.active{color:#e1f038}
.panel,.menu{overflow:hidden;margin-bottom:8px;border-radius:12px;background:var(--surface,#fff)}
.identity{display:flex;align-items:center;width:100%;min-height:64px;gap:16px;padding:12px 16px;text-align:left}
.avatar{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--yellow);font-size:16px;font-weight:600}
.grow{min-width:0;flex:1}
.meta{color:var(--muted);font-size:12px;line-height:16px}
.name{font-size:20px;font-weight:600;line-height:24px;overflow-wrap:anywhere}
.chevron{width:20px;height:20px;color:#bbb5aa}
.balance-main{display:flex;align-items:center;width:100%;gap:16px;padding:12px 16px;text-align:left}
.balance-main>svg:first-child{color:var(--green);width:24px}
.balance-main .meta{font-size:12px;margin-bottom:4px}
.balance-value{font-size:24px;font-weight:600;line-height:28px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.balance-value small{font-size:inherit}
.balance-actions{position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px 12px 56px}
.balance-actions::before{position:absolute;content:"";top:0;left:56px;right:0;height:1px;background:var(--line)}
.plain-action{height:32px;padding:0 12px;border-radius:100px;background:var(--surface-soft,#f2f1ee);font-size:14px;font-weight:600;white-space:nowrap}
.quick{display:flex;gap:8px;overflow:auto;padding:0 4px 8px;scrollbar-width:none}
.quick button{display:flex;align-items:center;gap:8px;white-space:nowrap;height:40px;padding:0 12px;border-radius:100px;background:var(--surface,white);font-size:16px;font-weight:600}
.quick svg{width:24px;color:var(--green)}
.row{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:56px;padding:12px 16px;text-align:left;font-size:16px;line-height:20px}
.row:not(:last-child)::after{content:"";position:absolute;bottom:0;left:56px;right:0;height:1px;background:var(--line)}
.row>svg:first-child{color:var(--green)}
.row>span{flex:1}
.caption{margin:16px 8px;color:var(--muted);font-size:11px;line-height:16px}
.data-page{min-height:100%;margin:-12px -8px;padding:1px 12px 24px;background:var(--surface,white)}
.section-label{margin:20px 8px 8px;color:var(--muted);font-size:10px;line-height:14px;font-weight:400;text-transform:uppercase;letter-spacing:.2px}
.data-group{padding:0 12px;border-radius:4px;background:var(--surface-soft,#f2f1ee)}
.data-field{display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 0;border-bottom:1px solid #dedbd5}
.data-field:last-child{border-bottom:0}
.data-field>div{min-width:0;flex:1}
.data-field .meta{font-size:10px;line-height:14px}
.data-value{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.icon-button{display:grid;place-items:center;width:32px;height:32px;padding:4px;color:var(--muted,#7b756b)}
.note{display:flex;align-items:flex-start;gap:8px;margin-top:24px;padding:12px;border-radius:4px;background:var(--surface-soft,#f2f1ee);color:var(--muted);font-size:12px;line-height:16px}
.note svg{width:20px;height:20px;flex:none}
.tabs{display:flex;gap:4px;margin:-12px -8px 12px;padding:12px;background:var(--surface,white)}
.tabs button{flex:1;padding:8px;border-radius:100px;font-size:14px;line-height:20px}
.tabs .active{background:var(--surface-active,#e5e4de)}
.empty{max-width:420px;margin:auto;padding:44px 20px;text-align:center}
.empty>svg{width:32px;height:32px;margin-bottom:8px;color:#bbb5aa}
.empty h2{margin:0 0 8px;font-size:16px;line-height:20px;font-weight:600}
.empty p{margin:0;color:var(--muted);font-size:13px;line-height:18px}
.payment{display:flex;justify-content:space-between;gap:12px;padding:16px 12px;border-bottom:1px solid var(--line);background:var(--surface,white);font-size:14px}
.payment strong{font-size:14px}
.positive{color:var(--green)}
.security{text-align:center;padding:32px 16px}
.security>svg{width:40px;height:40px;color:var(--green)}
.security h2{font-size:20px;font-weight:600}
.security p{color:var(--muted);font-size:14px;line-height:20px}
dialog{width:calc(100% - 24px);max-width:432px;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;border:0;border-radius:16px;background:var(--surface,white);color:var(--ink,#292621)}
dialog::backdrop{background:#0b0b0aa6}
body:has(dialog[open]){overflow:hidden}
.dialog-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dialog-head h2{flex:1;margin:0;font-size:24px;line-height:28px;font-weight:600}
.dialog-copy{margin:8px 0;color:var(--muted);font-size:12px;line-height:16px}
label{display:block;margin:16px 0 6px;font-size:12px;line-height:16px;color:var(--muted,#7b756b)}
input{width:100%;height:48px;padding:12px;border:1px solid var(--line,#e6e3de);border-radius:10px;background:var(--surface-soft,#f2f1ee);color:var(--ink,#292621);font-size:16px;line-height:20px}
input:focus{outline:1px solid #969186;outline-offset:0}
.password{position:relative}
.password input{padding-right:48px}
.password button{position:absolute;top:8px;right:8px}
.submit{width:100%;height:48px;margin-top:16px;padding:12px;border-radius:12px;background:var(--yellow);font-size:16px;font-weight:600}
.submit:hover{background:#e1f038}
.submit.green{background:var(--green);color:white}
.link-button{display:block;width:100%;height:44px;margin-top:8px;border-radius:12px;background:var(--surface-soft,#f2f1ee);font-size:14px;font-weight:600}
.error{min-height:16px;margin-top:8px;color:#e61414;font-size:12px;line-height:16px}
.toast{position:fixed;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);left:50%;z-index:50;width:max-content;max-width:calc(100% - 24px);transform:translateX(-50%);padding:12px 16px;border-radius:10px;background:#292621;color:white;font-size:13px;line-height:18px;box-shadow:0 4px 16px #0002}
.toast[hidden]{display:none}
@media(min-width:1024px){
  .profile-header .header-inner{max-width:none;padding:0 28px}
  .profile-content{max-width:640px;padding-top:24px}
  .profile-nav .nav-inner{max-width:640px}
}
@media(max-width:370px){
  .wordmark{width:108px}
  .header-inner{padding:0 8px;gap:4px}
  .deposit-button{padding:0 10px;font-size:13px}
  .header-icon{width:28px}
  .balance-actions{padding-left:56px;padding-right:8px;gap:6px}
  .balance-actions .deposit-button,.plain-action{font-size:13px;padding:0 9px}
  .nav-item{font-size:9px}
}

:root { --sports-header: 56px; --sports-footer: 54px; --sports-bg: #f5f4f1; --odds-blue: #2f8fc7; }
[hidden] { display: none !important; }
.sports-shell { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--sports-bg); }
.sports-header { flex: none; padding-top: env(safe-area-inset-top); background: #171716; color: #f6f6f2; }
.sports-header-inner { display: flex; align-items: center; gap: 8px; height: var(--sports-header); padding: 0 12px; }
.sports-header .brand { padding: 0; margin-right: auto; }
.desktop-menu { display: none; }
.sports-header .header-icon { flex: 0 0 32px; padding: 0; }
.desktop-links { display: none; }
.header-auth { display: flex; align-items: center; gap: 8px; flex: none; }
.login-button,.register-button { min-height: 32px; padding: 6px 12px; border-radius: 100px; white-space: nowrap; font-size: 14px; font-weight: 600; }
.login-button { background: var(--surface-soft,#f4f4f1); color: var(--ink,#242520); }
.register-button { background: #f2f740; color: var(--ink,#292621); }
.header-wallet { display: none; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; color: #e1f038; padding: 4px 0; }
.header-wallet small { font-size: 14px; }
.header-topup { height: 32px; padding: 0 14px; border-radius: 100px; background: #009e69; color: white; font-size: 14px; font-weight: 600; white-space: nowrap; }
.header-topup:hover { background: #008f5f; }
.header-topup svg { width: 20px; }
.sports-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior-y: contain; padding-bottom: 16px; scrollbar-width: thin; }
.line-container { max-width: 1200px; margin: auto; }
.stage-tabs { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 6px; background: var(--sports-bg); }
.stage-tabs>button { padding: 4px 6px; color: var(--muted,#7b756b); font-size: 12px; line-height: 20px; font-weight: 600; letter-spacing: .7px; min-height: 28px; }
.stage-tabs>button.active { color: #e61414; border-radius: 100px; box-shadow: inset 0 -1px 0 #ed8b8b; background: linear-gradient(0deg,#fbe1dd88,transparent 65%); }
.stage-tabs>button[data-value="prematch"].active { color: #007e54; background: transparent; box-shadow: none; }
.stage-tabs .coupon-icon { position: relative; margin-left: auto; padding: 4px; display: grid; place-items: center; }
.coupon-icon span { position: absolute; top: -3px; right: -5px; min-width: 16px; padding: 2px; border-radius: 12px; font-size: 10px; background: #e1f038; color: var(--ink,#242520); }
.line-search { padding: 5px 12px; }
.line-search input { background: var(--surface,white); }
.sport-tabs { display: flex; gap: 0; overflow: auto; scrollbar-width: none; border-bottom: 1px solid var(--line,#ddddda); }
.sport-tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 72px; max-width: 104px; height: 68px; flex: 0 0 auto; padding: 4px 8px 8px; font-size: 12px; line-height: 16px; border-bottom: 1px solid transparent; }
.sport-tabs button.active { border-color: #dce33b; background: linear-gradient(0deg,#f4f5d9,transparent 48%); }
.sport-tabs button>span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sport-symbol { display: grid; place-items: center; width: 32px; height: 32px; line-height: 1; }
.sport-symbol svg { width: 28px; height: 28px; color: #dabf00; fill: #f8da30; }
.tournament-tabs { display: flex; gap: 0; overflow: auto; scrollbar-width: none; padding: 16px 8px 4px; }
.tournament-tabs>button { display: flex; align-items: center; flex-direction: column; gap: 8px; flex: 0 0 80px; padding: 0 4px; font-size: 12px; }
.tournament-symbol { display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--surface,white); border: 2px solid transparent; }
.tournament-tabs>button.active .tournament-symbol { border-color: #c7d500; }
.tournament-name { min-height: 32px; line-height: 16px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }

.game-badge .reference-graphic { width: 100%; height: 100%; }
.tournament-symbol .game-badge { width: 28px; height: 28px; }
.line-summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 20px; min-height: 40px; font-size: 14px; color: var(--ink,#403c34); }
.line-summary>div { display: flex; align-items: center; gap: 8px; }
.line-summary svg { width: 17px; height: 17px; }
.market-label { display: flex; align-items: center; margin: 0; font-size: 14px; }
.market-label select { appearance: none; border: 0; background: transparent; font: inherit; color: inherit; padding: 5px 8px; max-width: 165px; }
.line-notice { display: flex; align-items: center; gap: 9px; font-size: 13px; line-height: 1.4; padding: 11px; margin: 0 12px 10px; background: #fff6dd; color: #6e571c; border-radius: 6px; }
.line-notice svg { flex: none; width: 18px; }
.event-list { padding: 0 12px 16px; }
.tournament-group { margin-bottom: 8px; }
.tournament-heading { display: flex; align-items: center; width: 100%; height: 32px; gap: 8px; padding: 8px 12px; text-align: left; background: var(--surface,white); border-radius: 20px 20px 4px 4px; font-size: 12px; line-height: 16px; }
.tournament-heading .game-badge { width: 16px; min-width: 16px; height: 16px; border-radius: 2px; font-size: 7px; }
.tournament-heading>span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tournament-heading>svg { width: 18px; color: var(--subtle,#b0aea4); flex: none; }
.match-card { background: var(--surface,white); border-radius: 4px 4px 24px 24px; margin-top: 2px; margin-bottom: 8px; padding: 8px; }
.match-meta { display: flex; align-items: center; gap: 4px; min-height: 16px; margin-bottom: 4px; color: var(--muted,#7b756b); font-size: 10px; line-height: 14px; }
.live-text { color: #e61414; }
.match-meta>span { font-weight: 600; }
.match-meta>svg { width: 15px; height: 15px; color: #e8b27b; }
.match-meta>button { margin-left: auto; display: flex; align-items: center; gap: 3px; padding: 0; color: #858177; font-size: 11px; }
.match-meta>button svg { width: 13px; height: 13px; }
.teams { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.teams-open { flex: 1; min-width: 0; padding: 0; text-align: left; }
.team-row { display: flex; align-items: center; gap: 4px; min-height: 28px; }
.team-mark { display: block; width: 20px; height: 20px; flex: none; }
.team-name { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.current-score { min-width: 18px; font-size: 14px; color: var(--ink,#575249); text-align: right; }
.match-score { min-width: 15px; font-size: 14px; color: #e61414; text-align: right; font-weight: 600; }
.favorite { flex: 0 0 24px; padding: 0; color: var(--muted,#7b756b); }
.favorite svg { width: 22px; height: 22px; }
.favorite.selected svg { fill: #e1f038; color: #969f00; }
.outcomes { display: flex; flex-wrap: wrap; gap: 7px; }
.odd { display: flex; flex: 1 1 22%; align-items: center; justify-content: center; flex-direction: column; min-width: 65px; min-height: 48px; padding: 6px 4px; background: var(--surface-soft,#f2f1ee); border-radius: 12px; color: var(--odds-blue); }
.odd strong { font-size: 16px; line-height: 20px; font-weight: 500; display: grid; place-items: center; }
.odd>span { color: var(--muted,#7b756b); font-size: 10px; line-height: 12px; margin-top: 0; }
.odd.selected { background: #f2f740; color: #303626; }
.odd.selected>span { color: #535827; }
.odd:disabled { color: #aaa89f; cursor: default; }
.odd.price-up:not(:disabled):not(.selected) { color: #009e69; }
.odd.price-down:not(:disabled):not(.selected) { color: #e61414; }
.odd svg { width: 17px; height: 18px; }
.more-outcomes { display: block; padding: 12px; width: 100%; border-radius: 12px; background: var(--surface-soft,#f1f1ee); color: var(--odds-blue); font-size: 14px; }
.expanded-markets { padding-top: 12px; }
.market-group { border-top: 1px solid #e5e5df; padding: 10px 0; }
.market-group h3 { font-size: 13px; font-weight: 500; margin: 0 2px 9px; }
.sports-nav { flex: none; padding: 0 4px env(safe-area-inset-bottom); min-height: var(--sports-footer); background: #171716; display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); color: #8f8d80; }
.sports-nav>button { min-width: 0; height: var(--sports-footer); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 3px; padding: 4px 1px; font-size: 10px; line-height: 14px; }
.sports-nav svg { width: 24px; height: 24px; }
.sports-nav>button.active { color: #e1f038; }

.sports-nav>button.active .ui-sports-score text { fill: #171716; }
.sports-nav>button>span { max-width: 100%; overflow-wrap: anywhere; }
.slip-mini { position: absolute; z-index: 5; bottom: calc(var(--sports-footer) + env(safe-area-inset-bottom) + 6px); left: 8px; right: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 17px; border-radius: 26px; background: #f2f740; font-size: 16px; font-weight: 600; box-shadow: 0 1px 6px #0001; }
.line-loading { min-height: 230px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: #84847c; font-size: 14px; }
.line-loading .spinner { margin: 0; }
.line-empty { padding: 42px 15px; text-align: center; color: #7b7c74; }
.line-empty>svg { width: 35px; height: 35px; color: #bcb8aa; }
.line-empty h2 { color: var(--ink,#2b2c25); font-size: 16px; font-weight: 500; }
.line-empty p { font-size: 14px; line-height: 1.45; }
.line-empty button { border-radius: 22px; background: #eaf431; padding: 11px 19px; color: var(--ink,#25261f); font-size: 14px; }
dialog.betslip { position: fixed; top: auto; right: 0; bottom: 0; left: 0; width: 100%; max-width: 590px; max-height: calc(100dvh - 25px); margin: 0 auto; padding: 0 0 env(safe-area-inset-bottom); border: 0; border-radius: 16px 16px 0 0; background: var(--surface,white); overflow: auto; overscroll-behavior: contain; }
dialog.betslip::backdrop { background: #0b0b0aa6; }
.slip-handle { width: 40px; height: 4px; margin: 9px auto 1px; border-radius: 6px; background: #c9c6bc; }
.slip-head { display: flex; align-items: center; gap: 4px; padding: 8px 12px 12px; border-bottom: 1px solid #e4e4df; }
.slip-head>.icon-button { margin-left: auto; color: #878276; }
.slip-types { display: flex; gap: 3px; flex: 1; }
.slip-types button { padding: 8px 12px; border-radius: 100px; font-size: 14px; line-height: 20px; }
.slip-types .active { background: var(--surface-active,#e6e6df); }
.slip-lines { max-height: 38dvh; overflow: auto; padding: 12px; }
.slip-selection { background: #e6e3de; border-radius: 12px; padding: 8px 12px 12px; margin-bottom: 8px; }

.language-sheet .language-save{margin:auto 16px calc(16px + env(safe-area-inset-bottom));width:calc(100% - 32px);height:48px;flex:none;font-size:14px}

.prematch-filters{display:flex;align-items:center;gap:8px;padding:8px 12px;justify-content:space-between}.prematch-filters[hidden]{display:none}.prematch-view-tabs{display:flex;gap:4px}.prematch-view-tabs button{font:inherit;font-size:13px;padding:8px 10px;border-radius:20px;color:var(--muted,#7b756b)}.prematch-view-tabs button.active{background:var(--surface-active,#e5e3de);color:var(--ink,#262521)}.prematch-filters select{font:inherit;font-size:13px;max-width:115px;border:0;border-radius:18px;background:var(--surface-active,#e5e3de);padding:8px;color:var(--ink,#262521)}.tournament-directory{border-radius:10px;overflow:hidden;background:var(--surface,white)}.tournament-directory>button{display:flex;align-items:center;gap:12px;width:100%;padding:16px;text-align:left;border-bottom:1px solid #eeece7}.tournament-directory>button>span:nth-child(2){flex:1}.tournament-directory small{color:var(--muted,#7b756b)}.bet-sport img{mix-blend-mode:multiply}.bet-coefficient.result-won{color:#009e69}.bet-coefficient.result-lost{color:#e6253a}.bet-coefficient.result-void{color:var(--subtle,#969186)}.bet-coefficient svg{width:16px;height:16px;vertical-align:middle;margin-left:4px}

.team-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none}.team-mark img{width:20px;height:20px;object-fit:contain;mix-blend-mode:multiply}.event-team-emblem img{width:40px;height:40px;object-fit:contain;mix-blend-mode:multiply}

.menu-toggle{width:36px;height:22px;border-radius:20px;background:#aaa;position:relative;flex:none}.menu-toggle::after{content:'';position:absolute;width:18px;height:18px;top:2px;left:2px;border-radius:50%;background:white;transition:transform .15s}.menu-edit-bets[aria-checked=true] .menu-toggle{background:#009e69}.menu-edit-bets[aria-checked=true] .menu-toggle::after{transform:translateX(14px)}.bet-record-actions>.delete-bet{color:#e6253a}

:root[data-theme=dark]{--page:#23211f;--sports-bg:#23211f;--surface:#171716;--surface-soft:#2d2a27;--surface-active:#393631;--ink:#f5f4f1;--muted:#aaa69d;--subtle:#a09b90;--line:#393630;--odds-blue:#65b6df;color-scheme:dark}
.gamepad-graphic{display:flex;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:24px;line-height:1;background:transparent;mix-blend-mode:normal;isolation:isolate}
.sport-symbol .gamepad-graphic{font-size:30px}.bet-sport .gamepad-graphic{width:24px;height:24px}
.team-emblem-picture{display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%}.team-mark .team-logo,.event-team-emblem .team-logo{mix-blend-mode:normal;object-fit:contain}.team-emblem-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-soft,#f2f1ee);border-radius:4px}.event-team-emblem .team-emblem-picture{width:40px;height:40px}.event-team-emblem .team-emblem-fallback{font-size:16px}.event-team-emblem{background:var(--surface,#fafaf8);border-color:var(--line)}
[data-theme=dark] .reference-graphic{mix-blend-mode:normal}
[data-theme=dark] .submit,[data-theme=dark] .register-button,[data-theme=dark] .odd.selected,[data-theme=dark] .avatar,[data-theme=dark] .slip-bar{color:#292621}

[data-theme=dark] .sport-tabs>button.active{background:linear-gradient(0deg,#74752144,transparent 65%)}
[data-theme=dark] input,[data-theme=dark] textarea{color:var(--ink);background:var(--surface-soft)}
[data-theme=dark] .site-menu input{background:transparent}
dialog#site-menu{position:fixed;inset:calc(56px + env(safe-area-inset-top)) 0 0;width:100%;height:calc(100dvh - 56px - env(safe-area-inset-top));max-width:480px;max-height:none;margin:0 auto;padding:0;border:0;border-radius:0;background:#25221f;color:#f5f4f1;overflow:auto}
#site-menu::backdrop{background:#0008}
.site-menu-head{position:sticky;top:0;display:flex;align-items:center;justify-content:center;height:44px;border-bottom:1px solid #3c3831;background:#25221f;z-index:1;font-size:16px}
.site-menu-head button{position:absolute;right:12px;padding:4px;color:#a6a092}
.site-menu-content{padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.site-menu-sections details{background:#171716;border-radius:8px;margin-bottom:10px;overflow:hidden}
.site-menu-sections summary{display:flex;align-items:center;justify-content:space-between;list-style:none;padding:14px 12px;cursor:pointer;font-size:14px}

.site-menu-sections details>button{display:block;width:100%;text-align:left;padding:12px 16px;color:#b4aea2;border-top:1px solid #292621;font-size:14px}
.site-menu-links{padding:8px 12px;background:#171716;border-radius:8px;margin-top:16px}
.site-menu-links>button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 0;text-align:left;color:#aaa498;font-size:14px}
.site-menu-links>button>span:first-child{flex:1}.site-menu-links svg{width:16px;height:16px}
.site-menu-links>.menu-theme{margin:8px 0 4px;padding:10px 12px;background:#26231f;border-radius:8px;color:#f5f4f1}.menu-theme>span{flex:1}.menu-theme small{display:block;font-size:12px;color:#9f998e;margin-top:3px}.menu-theme>svg:first-child{width:20px;height:20px;color:#a39c8d}
dialog.theme-sheet{position:fixed;inset:auto 0 0;width:100%;max-width:480px;max-height:calc(100dvh - 40px);margin:0 auto;padding:0;border:0;border-radius:18px 18px 0 0;background:var(--surface,#fff);color:var(--ink,#292621)}
.theme-sheet .dialog-head{padding:16px 16px 0;margin:0;min-height:44px}.theme-sheet .dialog-head h2{font-size:16px;flex:1;text-align:center;padding-left:32px}.theme-sheet .dialog-head .icon-button{width:28px;height:28px}
.theme-description{font-size:12px;line-height:18px;text-align:center;color:var(--muted);margin:4px 16px 12px}
.theme-options{background:var(--surface-soft,#f2f1ee);border-radius:8px;margin:0 16px 24px;padding:0 12px}
.theme-options label{display:flex;align-items:center;gap:12px;min-height:60px;margin:0;border-bottom:1px solid var(--line);cursor:pointer}.theme-options label:last-child{border:0}.theme-options label>svg{width:20px;color:var(--muted)}.theme-options label>span{flex:1}.theme-options strong{display:block;font-size:14px;font-weight:400}.theme-options small{display:block;color:var(--muted);font-size:12px;line-height:16px;margin-top:3px}.theme-options input{width:18px;height:18px;margin:0;accent-color:#009e69}
.theme-sheet .theme-save{width:calc(100% - 32px);height:48px;margin:0 16px calc(16px + env(safe-area-inset-bottom));color:#292621}

.theme-options input,.language-options input{padding:0;border:0;background:transparent;appearance:auto}.theme-options strong{color:var(--ink,#292621)}

[data-theme=dark] .team-emblem-picture{background:#e9e7e1;border-radius:4px;padding:1px}[data-theme=dark] .event-team-emblem{background:#e9e7e1}
